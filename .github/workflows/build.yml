name: Build DeepLog

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # libdivecomputer is a submodule and the NDK build compiles its
          # sources directly; without this the checkout leaves it empty and
          # CMake fails on the first missing .c file.
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate libdivecomputer headers
        # version.h and revision.h are produced by autotools, which does not
        # run here, and the submodule gitignores both. Generate them from the
        # submodule's own configure.ac so the version never drifts.
        run: |
          set -euo pipefail
          cd libdivecomputer
          major=$(sed -n 's/^m4_define(\[dc_version_major\],\[\([0-9]*\)\]).*/\1/p' configure.ac)
          minor=$(sed -n 's/^m4_define(\[dc_version_minor\],\[\([0-9]*\)\]).*/\1/p' configure.ac)
          micro=$(sed -n 's/^m4_define(\[dc_version_micro\],\[\([0-9]*\)\]).*/\1/p' configure.ac)
          suffix=$(sed -n 's/^m4_define(\[dc_version_suffix\],\[\([A-Za-z0-9]*\)\]).*/\1/p' configure.ac)
          version="${major}.${minor}.${micro}${suffix:+-$suffix}"
          echo "libdivecomputer ${version}"

          sed -e "s/@DC_VERSION@/${version}/g" \
              -e "s/@DC_VERSION_MAJOR@/${major}/g" \
              -e "s/@DC_VERSION_MINOR@/${minor}/g" \
              -e "s/@DC_VERSION_MICRO@/${micro}/g" \
              include/libdivecomputer/version.h.in > include/libdivecomputer/version.h

          echo "#define DC_VERSION_REVISION \"$(git rev-parse --short HEAD)\"" > src/revision.h

          test -s include/libdivecomputer/version.h
          test -s src/revision.h

      - name: Generate Gradle wrapper
        # gradle-wrapper.jar is gitignored, so ./gradlew cannot run from a
        # fresh checkout until the wrapper is regenerated.
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-build-cache -Dorg.gradle.workers.max=4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/deeplog.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deeplog-apk
          path: app/build/outputs/apk/debug/deeplog.apk
          retention-days: 30

  web:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        working-directory: web/test
        run: npm install --no-audit --no-fund

      - name: Run the web suites
        working-directory: web/test
        run: npm test

      - name: Verify the installable app
        working-directory: web/test
        # Chrome is preinstalled on the runner image.
        env:
          CHROME: /usr/bin/google-chrome
        run: npm run pwa
