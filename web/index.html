<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07141F">
<title>DeepLog</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="css/app.css">

<!-- Installable on Android and, via Add to Home Screen, on iOS. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DeepLog">
<meta name="description" content="Your personal map of the underwater world: dive log, sites, map and statistics.">
</head>
<body>

<!-- ───────────────────────────── Sign in ───────────────────────────── -->
<div id="login-view">
  <div class="auth">
    <div class="brand">Deep<span class="mark">Log</span></div>
    <div class="tag">Your personal map of the underwater world. Sign in with the
      same account as the phone app.</div>

    <div class="stack" style="gap:12px">
      <div class="field">
        <label for="email">Email</label>
        <input class="input" id="email" type="email" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" type="password" autocomplete="current-password">
      </div>
    </div>

    <div class="row" style="margin-top:20px">
      <button class="btn btn-ghost grow" id="btn-signup">Create account</button>
      <button class="btn btn-primary grow" id="btn-signin">Sign in</button>
    </div>
    <div class="msg" id="login-msg"></div>
  </div>
</div>

<!-- ───────────────────────────── App ───────────────────────────── -->
<div id="app-view" class="hidden">

  <header class="topbar">
    <div class="brand">Deep<span class="mark">Log</span></div>

    <nav class="navlinks" aria-label="Main">
      <button class="navlink active" data-nav="dives">Dives</button>
      <button class="navlink" data-nav="sites">Sites</button>
      <button class="navlink" data-nav="map">Map</button>
      <button class="navlink" data-nav="stats">Statistics</button>
    </nav>

    <span class="grow"></span>

    <button class="btn btn-ghost hidden" id="btn-install">Install</button>
    <button class="btn btn-primary" id="nav-log">
      <svg class="ico"><use href="#i-plus"></use></svg> Log dive
    </button>
    <button class="account" id="btn-account" title="Account" aria-label="Account"></button>
  </header>

  <main>
    <section id="view-dives" class="page"></section>
    <section id="view-dive"  class="page hidden"></section>
    <section id="view-sites" class="page hidden"></section>
    <section id="view-site"  class="page hidden"></section>
    <section id="view-map"   class="page hidden"></section>
    <section id="view-stats" class="page hidden"></section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <button class="tab active" data-nav="dives">
      <svg class="ico"><use href="#i-log"></use></svg><span>Dives</span>
    </button>
    <button class="tab" data-nav="sites">
      <svg class="ico"><use href="#i-pin"></use></svg><span>Sites</span>
    </button>
    <button class="tab tab-log" id="tab-log" aria-label="Log a dive">
      <span class="fab"><svg class="ico"><use href="#i-plus"></use></svg></span>
      <span class="lbl">Log</span>
    </button>
    <button class="tab" data-nav="map">
      <svg class="ico"><use href="#i-map"></use></svg><span>Map</span>
    </button>
    <button class="tab" data-nav="stats">
      <svg class="ico"><use href="#i-chart"></use></svg><span>Stats</span>
    </button>
  </nav>
</div>

<div id="sheet-host"></div>
<div id="toast-host"></div>

<!-- ── Icon sprite: one stroke weight and style throughout ── -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-depth" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v14"/><path d="m7 12 5 5 5-5"/><path d="M4 21h16"/>
  </symbol>
  <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/>
  </symbol>
  <symbol id="i-temp" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 13.6V5a2 2 0 1 1 4 0v8.6a4.5 4.5 0 1 1-4 0Z"/>
  </symbol>
  <symbol id="i-gas" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="6" width="8" height="15" rx="3"/><path d="M10 6V4h4v2"/><path d="M8 10h8"/>
  </symbol>
  <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/>
  </symbol>
  <symbol id="i-map" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="m9 4-6 2.6v13L9 17l6 3 6-2.6v-13L15 7 9 4Z"/><path d="M9 4v13"/><path d="M15 7v13"/>
  </symbol>
  <symbol id="i-log" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 4.5h11a3 3 0 0 1 3 3v12H8a3 3 0 0 1-3-3v-12Z"/><path d="M5 16.5h14"/>
    <path d="M9 8.5h6"/>
  </symbol>
  <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M21 20H3"/>
  </symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5v14"/><path d="M5 12h14"/>
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>
  </symbol>
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 5l-7 7 7 7"/>
  </symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m5 12.5 4.5 4.5L19 7"/>
  </symbol>
  <symbol id="i-wave" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 8c2.5-2.5 4.5-2.5 7 0s4.5 2.5 7 0 3.4-1.8 4 0"/>
    <path d="M3 14c2.5-2.5 4.5-2.5 7 0s4.5 2.5 7 0 3.4-1.8 4 0"/>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/>
  </symbol>
  <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20h4L19 9a2.5 2.5 0 0 0-4-4L4 16v4Z"/>
  </symbol>
</svg>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/util.js"></script>
<script src="js/api.js"></script>
<script src="js/catalogue.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/views.js"></script>
<script src="js/map.js"></script>
<script src="js/logdive.js"></script>
<script src="js/app.js"></script>
</body>
</html>
